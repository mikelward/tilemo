name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # tide's geometry and clocks module are copied here unchanged; check
      # they still match.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tide
          path: tide
      # So are the dashboard's clock modules from tileco.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tileco
          path: tileco
      # Ubuntu packages Lua 5.4, which is what Hammerspoon embeds.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      # The runner's Node runs the dashboard page test, which mustn't skip.
      - run: make lint test
        env:
          TILEMO_NEED_NODE: "1"
      - run: make check-tide TIDE=tide
      - run: make check-tileco TILECO=tileco
  # A smoke test in a real Hammerspoon: every hs.* name tilemo uses exists,
  # tilemo starts and opens its dashboard, and it tiles three windows. The
  # runner comes with Accessibility granted; tests/ covers the rest.
  hammerspoon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install --cask hammerspoon
      - run: ci/hs-smoke.sh
