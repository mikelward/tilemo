name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # tide's geometry, clocks, startup and clipboard modules are copied here unchanged; check
      # they still match.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tide
          path: tide
          persist-credentials: false
      # So are the dashboard's clock modules and the dashboard launcher's page
      # from tideco.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tideco
          path: tideco
          persist-credentials: false
      # Ubuntu packages Lua 5.4, which is what Hammerspoon embeds.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      # The runner's Node runs the dashboard page test, which mustn't skip.
      - run: make lint test
        env:
          TIDE_NEED_NODE: "1"
      - run: make check-tide TIDE=tide
      - run: make check-tideco TIDECO=tideco
  # A smoke test in a real Hammerspoon: every hs.* name tide uses exists,
  # tide starts and opens its dashboard, and it tiles three windows. The
  # runner comes with Accessibility granted; tests/ covers the rest.
  hammerspoon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew install --cask hammerspoon
      - run: ci/hs-smoke.sh
