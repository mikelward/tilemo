name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # tide's geometry is copied here unchanged; check it still matches.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tide
          path: tide
      # So are the dashboard's clock modules from tico.
      - uses: actions/checkout@v4
        with:
          repository: mikelward/tico
          path: tico
      # Ubuntu packages Lua 5.4, which is what Hammerspoon embeds.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      # The runner's Node runs the dashboard page test, which mustn't skip.
      - run: make lint test
        env:
          TIMO_NEED_NODE: "1"
      - run: make check-geometry TIDE=tide
      - run: make check-tico TICO=tico
  # A smoke test in a real Hammerspoon: every hs.* name timo uses exists,
  # and timo starts and opens its dashboard. Hosted runners can't grant
  # Accessibility, so nothing tiles here; tests/ covers the behavior.
  hammerspoon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install --cask hammerspoon
      - run: ci/hs-smoke.sh
