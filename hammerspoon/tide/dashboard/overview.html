<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tide</title>
<style>
/*TIDE_CSS*/
body {
  overflow: hidden;
}
.overview {
  flex: 1;
  overflow-y: auto;
  padding: 32px 48px 16px;
}
.group {
  margin: 0 auto 28px;
  max-width: 1600px;
}
.group .header {
  display: inline-block;
  margin: 0 0 10px;
  padding: 2px 10px;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  color: var(--fg);
  background: none;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}
.group.current .header {
  color: var(--on-accent);
  background: var(--accent);
}
.group .header:hover {
  background: var(--hover);
}
.group.current .header:hover {
  background: var(--accent);
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
}
.card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  min-width: 0;
  font: inherit;
  color: var(--fg);
  text-align: left;
  background: var(--surface);
  border: 2px solid transparent;
  border-radius: 10px;
  cursor: pointer;
}
.card:hover {
  background: var(--raised);
}
.card.selected {
  border-color: var(--accent);
}
.card.minimized {
  opacity: 0.7;
}
.card .icon {
  flex: none;
  width: 32px;
  height: 32px;
}
.card .blank {
  border-radius: 6px;
  background: var(--raised);
}
.card .text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.card .name,
.card .app {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.card .app {
  color: var(--muted);
  font-size: 12px;
}
.note {
  margin: 0 10px;
  color: var(--muted);
}
.hint {
  display: flex;
  justify-content: center;
  gap: 16px;
  padding: 8px;
  color: var(--muted);
}
#filter:not(:empty)::before {
  content: "Filter: ";
}
#filter {
  color: var(--fg);
}
</style>
</head>
<body>
<main id="groups" class="overview" aria-label="Windows"></main>
<footer class="hint">
<span id="filter"></span>
<span>Type to filter · arrows and Return to go · Esc to close</span>
</footer>
<script>
/*TIDE_SCRIPT*/
</script>
</body>
</html>
