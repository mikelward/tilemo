<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tide volume</title>
<script>
window.onerror = (message, source, line, column) => {
  window.webkit?.messageHandlers?.tide?.postMessage({ error: `${message} (line ${line}:${column})` });
};
</script>
<style>
/*TIDE_CSS*/
</style>
<style>
/* The volume popover (SPEC.md §8), as tide's: a card in the bar's colors,
   the output's name over its slider and mute, the outputs, then Sound
   settings. volume.lua's ROW and CHROME follow these heights. */
html, body {
  margin: 0;
  background: transparent;
  overflow: hidden;
  font: 13px -apple-system, system-ui, sans-serif;
  color: var(--fg);
}
#card {
  box-sizing: border-box;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border: 1px solid var(--raised);
  border-radius: 10px;
  padding: 6px 0;
}
h2 {
  margin: 0;
  padding: 6px 12px 2px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
}
#level {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 12px;
}
#mute {
  border: none;
  background: none;
  color: var(--fg);
  padding: 2px;
  border-radius: 6px;
  cursor: default;
}
#mute:hover, .row:hover {
  background: var(--hover);
}
#mute[disabled] {
  opacity: 0.4;
}
#slider {
  flex: 1;
  accent-color: var(--accent);
}
#percent {
  width: 3.2em;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
#none {
  flex: 1;
  color: var(--muted);
}
#outputs {
  flex: 1;
  overflow-y: auto;
}
.row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  height: 30px;
  box-sizing: border-box;
  padding: 0 12px;
  border: none;
  background: none;
  color: var(--fg);
  font: inherit;
  text-align: left;
  cursor: default;
}
.row .check {
  width: 1em;
  color: var(--accent);
}
.row .name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#settings {
  border-top: 1px solid var(--raised);
}
</style>
</head>
<body>
<div id="card">
  <h2 id="name">Sound</h2>
  <div id="level">
    <button id="mute" type="button" aria-label="Mute"></button>
    <input id="slider" type="range" min="0" max="100" step="1" aria-label="Volume">
    <span id="percent"></span>
    <span id="none" hidden>No volume control</span>
  </div>
  <h2>Output</h2>
  <div id="outputs"></div>
  <button id="settings" class="row" type="button"><span class="check"></span><span class="name">Sound Settings…</span></button>
</div>
<script>
/*TIDE_SCRIPT*/
</script>
</body>
</html>
