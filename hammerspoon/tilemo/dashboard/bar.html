<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tilemo bar</title>
<script>
// First, so an error in the bar's own script, even one that stops it
// parsing, still reaches tilemo, which logs it.
window.onerror = (message, source, line, column) => {
  window.webkit?.messageHandlers?.tilemo?.postMessage({ error: `${message} (line ${line}:${column})` });
};
</script>
<style>
/*TILEMO_CSS*/
</style>
<style>
/* tilemo's additions to tileco's bar: the right-hand group, local time alone
   when crowded, and the status icons. */
body {
  background: var(--bar);
  overflow: hidden;
}
/* tide's logo, then the chips: tileco's #logo styles place and color it.
   A click opens the switcher, as Super+Space does. */
#left {
  display: flex;
  align-items: center;
}
#logo svg {
  display: block;
}
/* A chip's window icons follow its number. */
nav button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0 6px;
}
/* A window icon's click target is the chip's full height and halfway to
   its neighbors (the chip's gap is 3px), from padding the margin takes back,
   so a click just beside the icon still focuses the window. */
nav button .app {
  box-sizing: content-box;
  width: 16px;
  height: 16px;
  padding: 4px 1.5px;
  margin: -4px -1.5px;
}
nav button .app.none {
  background: var(--muted);
  /* The square is the content box, its corners 4px once the padding's
     taken off. */
  background-clip: content-box;
  border-radius: 5.5px / 8px;
  opacity: 0.4;
}
nav button .more {
  font-size: 0.85em;
}
/* Each item's click target: a box under its content (so a window icon in a
   chip stays its own target) reaching as far as bar.js's --reach-* say, to
   the bar's top and bottom and halfway to each neighbor. ::before takes the
   clicks; ::after, the same box, shows it on hover (tileco's stylesheet). */
#logo,
nav > button,
#clocks,
#icons > .icon {
  position: relative;
  z-index: 0;
}
#logo::before,
#logo::after,
nav > button::before,
nav > button::after,
nav > button:first-child::before,
nav > button:first-child::after,
#logo + nav > button:first-child::before,
#logo + nav > button:first-child::after,
#clocks::before,
#clocks::after,
#icons > .icon::before,
#icons > .icon::after,
#title::before,
#title::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: calc(-1 * var(--reach-top, 0px));
  bottom: calc(-1 * var(--reach-bottom, 0px));
  left: calc(-1 * var(--reach-left, 0px));
  right: calc(-1 * var(--reach-right, 0px));
}
#logo::after,
#icons > .icon::after,
#title::after {
  border-radius: 6px;
  pointer-events: none;
}
/* The title's target is the free bar around it, between the two groups,
   for a double click. Its text is the inner span, which clips. */
#title {
  z-index: 0;
}
/* From the chip's border edge, not its padding's. */
nav > button::before,
nav > button::after {
  margin: -1px;
}
/* Under the pointer the whole target shows, a rounded rect half pressed.
   bar.js marks it .hover: the bar's window is never key, and WebKit only
   follows the pointer in the key window, so :hover never fires here. */
#logo.hover::after,
nav > button.hover::after,
#clocks.hover::after,
#icons > button.icon.hover::after,
#icons > button.icon:hover::after,
#title.hover::after {
  background: var(--hover);
}
/* Over a window icon, the icon's target shows rather than the chip's: the
   chip's height and halfway to its neighbors, from its padding. Its corners
   are always round, so hovering doesn't move where a click goes. */
nav > button:has(.app.hover)::after,
nav > button:has(.app.win:hover)::after {
  background: none;
}
nav button img.app.win {
  border-radius: 4px;
}
nav button img.app.win.hover,
nav button img.app.win:hover {
  background: var(--hover);
}
nav button .app.none.win.hover,
nav button .app.none.win:hover {
  background: linear-gradient(var(--muted), var(--muted)) content-box, var(--hover);
}
/* Held to the room between the two sides by bar.js, one line. */
#title-text {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#right {
  display: flex;
  align-items: center;
  gap: 14px;
}
#clocks.compact li:not(:last-child) {
  display: none;
}
#icons {
  display: flex;
  align-items: center;
  gap: 2px;
}
/* Line icons in the text color (bar.js draws them); state shows as color,
   not a background. */
#icons .icon {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 26px;
  padding: 0 6px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--fg);
  font: inherit;
  cursor: pointer;
}
#icons svg {
  display: block;
  flex: none;
}
#icons .source {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
#icons [data-state="off"],
#icons [data-state="muted"],
#icons [data-state="mute"],
#icons [data-state="none"] {
  color: var(--muted);
}
#icons [data-state="on"].awake,
#icons [data-state="in-use"] {
  color: var(--accent);
}
/* Presenter mode: a filled accent pill, so it's hard to miss, as tide's
   Presenting pill is. */
#icons .awake[data-state="presenting"] {
  background: var(--accent);
  color: var(--on-accent);
  font-size: 11px;
  font-weight: 600;
}
#icons .battery[data-state="low"] {
  color: var(--urgent);
}
#icons .battery .text {
  font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>
<header class="bar" id="bar">
<div id="left">
<button type="button" id="logo" aria-label="Switcher"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.75 6.25q2.083-2 4.167 0t4.166 0t4.167 0"/><path d="M1.75 10.75q2.083-2 4.167 0t4.166 0t4.167 0"/></svg></button>
<nav id="workspaces" aria-label="Workspaces"></nav>
</div>
<span id="title"><span id="title-text"></span></span>
<div id="right">
<ol id="clocks"></ol>
<div id="icons"></div>
</div>
</header>
<script>
/*TILEMO_SCRIPT*/
</script>
</body>
</html>
