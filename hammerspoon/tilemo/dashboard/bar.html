<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tilemo bar</title>
<script>
// First, so an error in the bar's own script, even one that stops it
// parsing, still reaches tilemo, which logs it.
window.onerror = (message, source, line, column) => {
  window.webkit?.messageHandlers?.tilemo?.postMessage({ error: `${message} (line ${line}:${column})` });
};
</script>
<style>
/*TILEMO_CSS*/
</style>
<style>
/* tilemo's additions to tileco's bar: the right-hand group, local time alone
   when crowded, and the status icons. */
body {
  background: var(--bar);
  overflow: hidden;
}
/* A chip's window icons follow its number. */
nav button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0 6px;
}
nav button .app {
  width: 16px;
  height: 16px;
}
nav button .app.none {
  border-radius: 4px;
  background: var(--muted);
  opacity: 0.4;
}
nav button .more {
  font-size: 0.85em;
}
/* Held to the room between the two sides by bar.js, one line. */
#title {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#right {
  display: flex;
  align-items: center;
  gap: 14px;
}
#clocks.compact li:not(:last-child) {
  display: none;
}
#icons {
  display: flex;
  align-items: center;
  gap: 2px;
}
/* Line icons in the text color (bar.js draws them); state shows as color,
   not a background. */
#icons .icon {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 26px;
  padding: 0 6px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--fg);
  font: inherit;
  cursor: pointer;
}
#icons button.icon:hover {
  background: var(--raised);
}
#icons svg {
  display: block;
  flex: none;
}
#icons .source {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
#icons [data-state="off"],
#icons [data-state="muted"],
#icons [data-state="mute"],
#icons [data-state="none"] {
  color: var(--muted);
}
#icons [data-state="on"].awake,
#icons [data-state="in-use"] {
  color: var(--accent);
}
/* Presenter mode: a filled accent pill, so it's hard to miss, as tide's
   Presenting pill is. */
#icons .awake[data-state="presenting"] {
  background: var(--accent);
  color: var(--on-accent);
  font-size: 11px;
  font-weight: 600;
}
#icons .battery[data-state="low"] {
  color: var(--urgent);
}
#icons .battery .text {
  font-variant-numeric: tabular-nums;
}
</style>
</head>
<body>
<header class="bar" id="bar">
<nav id="workspaces" aria-label="Workspaces"></nav>
<span id="title"></span>
<div id="right">
<ol id="clocks"></ol>
<div id="icons"></div>
</div>
</header>
<script>
/*TILEMO_SCRIPT*/
</script>
</body>
</html>
